<!DOCTYPE html>
<!-- Author playground for the organic trainer. Never published (only site/ is).
     Serve the repo root (".claude/launch.json" entry "repo", port 8001) and open
     http://localhost:8001/tools/organic/playground.html?unit=u07   (unit=fixture loads tests/organic/fixtures/unit-a.js)
     Options: &lang=en   &seeds=5   &theme=dark   See tools/organic/AUTHORING.md. -->
<html lang="lt">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Organic playground</title>
<link rel="stylesheet" href="../../site/organic/trainer.css">
<style>
  .pg-bar { display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: baseline; padding: 14px 0 6px; }
  .pg-bar h1 { font: 700 26px/1 var(--hand); margin: 0; }
  .pg-bar a, .pg-bar button { font-size: 13px; }
  .pg-sec { margin: 22px 0 8px; font: 600 18px/1.3 var(--ui); border-bottom: 2px solid var(--line); padding-bottom: 4px; }
  .pg-ok { color: var(--good); font-weight: 600; }
  .pg-err { color: var(--bad); }
  .pg-warn { color: var(--s); }
  .pg-list { margin: 4px 0 8px; padding-left: 20px; font: 13px/1.5 ui-monospace, Consolas, monospace; }
  .pg-cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(330px, 1fr)); gap: 12px; }
  .pg-card { background: var(--sheet); border: 1px solid var(--line); border-radius: 4px; padding: 10px 12px; min-width: 0; }
  .pg-card h4 { margin: 0 0 4px; font: 600 14px/1.3 ui-monospace, Consolas, monospace; overflow-wrap: anywhere; }
  .pg-card .pg-pair { display: flex; flex-wrap: wrap; gap: 6px 12px; align-items: flex-start; }
  .pg-card .pg-cap { display: block; font-size: 11px; color: var(--ink2); }
  .pg-card p { margin: 3px 0; font-size: 13px; }
  .pg-card table { border-collapse: collapse; font: 12px/1.3 ui-monospace, Consolas, monospace; margin-top: 4px; }
  .pg-card td, .pg-card th { border-bottom: 1px solid var(--line); padding: 1px 6px; text-align: left; }
  .pg-card .pg-bad { background: var(--bad-bg); }
  .pg-where { font-size: 11px; color: var(--ink2); }
  .pg-prob { margin: 14px 0 22px; }
  .pg-prob > h3 { font: 600 14px/1.3 ui-monospace, Consolas, monospace; margin: 0 0 4px; color: var(--ink2); }
  .pg-sub { margin: 18px 0 4px; font: 600 15px/1.3 var(--ui); }
  .pg-note { color: var(--ink2); font-size: 13px; }
  details.pg-fold > summary { cursor: pointer; font-weight: 600; margin: 8px 0; }
</style>
</head>
<body>
<!-- ui.js (the trainer's own renderer) expects these three elements; they stay hidden here -->
<div hidden>
  <h1 id="brand"></h1>
  <div id="langs"><button type="button" data-lang="lt"></button><button type="button" data-lang="en"></button></div>
  <button type="button" id="reset"></button>
</div>
<main class="app" id="app" tabindex="-1">
  <p class="plain">Loading…</p>
</main>
<script src="../../site/organic/js/chem.js"></script>
<script src="../../site/organic/js/stereo.js"></script>
<script src="../../site/organic/js/draw.js"></script>
<script src="../../site/organic/js/views.js"></script>
<script src="../../site/organic/js/name.js"></script>
<script src="../../site/organic/js/react.js"></script>
<script src="../../site/organic/js/units.js"></script>
<script src="../../site/organic/js/check.js"></script>
<script src="../../site/organic/js/progress.js"></script>
<script src="../../site/organic/js/ui.js"></script>
<script src="playground.js"></script>
</body>
</html>
